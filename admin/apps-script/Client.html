<script>
  (function () {
    "use strict";

    var PLAYED_STATUSES = ["jugado", "wo_j1", "wo_j2", "wo_ambos"];
    var PENDING_STATUSES = ["pendiente", "reprogramado", "suspendido"];
    var state = {
      dashboard: window.__INITIAL_DATA__ || { summary: {}, matches: [] },
      view: "pending",
      query: "",
      category: "",
      currentMatch: null,
      toastTimer: null
    };

    var elements = {
      season: document.getElementById("seasonLabel"),
      updated: document.getElementById("updatedLabel"),
      pending: document.getElementById("pendingCount"),
      upcoming: document.getElementById("upcomingCount"),
      played: document.getElementById("playedCount"),
      search: document.getElementById("searchInput"),
      category: document.getElementById("categoryFilter"),
      tabs: Array.prototype.slice.call(document.querySelectorAll(".tabs button")),
      matchList: document.getElementById("matchList"),
      refresh: document.getElementById("refreshButton"),
      dialog: document.getElementById("matchDialog"),
      form: document.getElementById("matchForm"),
      dialogMeta: document.getElementById("dialogMeta"),
      dialogTitle: document.getElementById("dialogTitle"),
      matchId: document.getElementById("matchIdInput"),
      status: document.getElementById("statusInput"),
      date: document.getElementById("dateInput"),
      scoreSection: document.getElementById("scoreSection"),
      scorePlayer1: document.getElementById("scorePlayer1"),
      scorePlayer2: document.getElementById("scorePlayer2"),
      set1Player1: document.getElementById("set1Player1"),
      set1Player2: document.getElementById("set1Player2"),
      set2Player1: document.getElementById("set2Player1"),
      set2Player2: document.getElementById("set2Player2"),
      stbPlayer1: document.getElementById("stbPlayer1"),
      stbPlayer2: document.getElementById("stbPlayer2"),
      woExplanation: document.getElementById("woExplanation"),
      notes: document.getElementById("notesInput"),
      error: document.getElementById("formError"),
      close: document.getElementById("closeDialog"),
      cancel: document.getElementById("cancelButton"),
      save: document.getElementById("saveButton"),
      loading: document.getElementById("loadingOverlay"),
      toast: document.getElementById("toast")
    };

    function normalize(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function setText(element, value) {
      element.textContent = String(value == null ? "" : value);
    }

    function createElement(tag, className, text) {
      var element = document.createElement(tag);
      if (className) element.className = className;
      if (typeof text !== "undefined") setText(element, text);
      return element;
    }

    function renderDashboard() {
      var dashboard = state.dashboard || {};
      var summary = dashboard.summary || {};
      setText(elements.season, dashboard.season || "");
      setText(elements.updated, dashboard.generatedAt
        ? "Actualizado " + dashboard.generatedAt + " · " + (dashboard.spreadsheetName || "Google Sheets")
        : "");
      setText(elements.pending, summary.pending || 0);
      setText(elements.upcoming, summary.upcoming || 0);
      setText(elements.played, summary.played || 0);
      renderMatches();
    }

    function matchBelongsToView(match) {
      if (state.view === "pending") return PENDING_STATUSES.indexOf(match.status) >= 0;
      if (state.view === "upcoming") return match.status === "programado";
      if (state.view === "recent") return PLAYED_STATUSES.indexOf(match.status) >= 0;
      return true;
    }

    function visibleMatches() {
      var query = normalize(state.query);
      var category = normalize(state.category);
      var matches = (state.dashboard.matches || []).filter(function (match) {
        var players = normalize(match.player1 + " " + match.player2);
        return matchBelongsToView(match) &&
          (!query || players.indexOf(query) >= 0) &&
          (!category || normalize(match.category) === category);
      });

      if (state.view === "recent") matches.reverse();
      return matches;
    }

    function renderMatches() {
      var matches = visibleMatches();
      elements.matchList.replaceChildren();

      if (!matches.length) {
        var empty = createElement("div", "empty-state");
        empty.appendChild(createElement("strong", "", "No hay partidos en esta vista"));
        empty.appendChild(createElement("p", "", state.query || state.category
          ? "Prueba cambiando la búsqueda o el filtro."
          : "Cuando cambie el estado de un partido aparecerá aquí."));
        elements.matchList.appendChild(empty);
        return;
      }

      var fragment = document.createDocumentFragment();
      matches.forEach(function (match) {
        var card = createElement("button", "match-card");
        card.type = "button";
        card.dataset.matchId = match.matchId;
        card.setAttribute("aria-label", "Editar " + match.player1 + " contra " + match.player2);

        var top = createElement("div", "match-top");
        var metaParts = [
          match.category ? "Categoría " + match.category : "",
          match.week ? "Semana " + match.week : "",
          match.court ? "Cancha " + match.court : "",
          match.turn ? match.turn : ""
        ].filter(Boolean);
        top.appendChild(createElement("span", "match-meta", metaParts.join(" · ")));
        top.appendChild(createElement("span", "status-pill " + match.status, match.statusLabel));

        var players = createElement("div", "match-players");
        players.appendChild(createElement("span", "", match.player1));
        players.appendChild(createElement("span", "versus", "VS"));
        players.appendChild(createElement("span", "", match.player2));

        card.appendChild(top);
        card.appendChild(players);

        var detail = match.resultWeb || match.notes || (match.date ? "Fecha: " + match.date : "Toca para registrar");
        if (detail) card.appendChild(createElement("div", "match-result", detail));
        card.addEventListener("click", function () { openMatch(match.matchId); });
        fragment.appendChild(card);
      });
      elements.matchList.appendChild(fragment);
    }

    function findMatch(matchId) {
      return (state.dashboard.matches || []).find(function (match) {
        return match.matchId === matchId;
      }) || null;
    }

    function dateForInput(value) {
      var text = String(value || "").trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
      var match = text.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
      if (!match) return "";
      return match[3] + "-" + match[2].padStart(2, "0") + "-" + match[1].padStart(2, "0");
    }

    function dateForSheet(value) {
      var match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return match ? Number(match[3]) + "/" + Number(match[2]) + "/" + match[1] : value;
    }

    function setScoreValue(element, value) {
      element.value = value === 0 || value ? value : "";
    }

    function updatePlayerLabels(match) {
      setText(elements.scorePlayer1, match.player1);
      setText(elements.scorePlayer2, match.player2);

      elements.set1Player1.setAttribute("aria-label", "Set 1, " + match.player1);
      elements.set1Player2.setAttribute("aria-label", "Set 1, " + match.player2);
      elements.set2Player1.setAttribute("aria-label", "Set 2, " + match.player1);
      elements.set2Player2.setAttribute("aria-label", "Set 2, " + match.player2);
      elements.stbPlayer1.setAttribute("aria-label", "Super tie-break, " + match.player1);
      elements.stbPlayer2.setAttribute("aria-label", "Super tie-break, " + match.player2);

      elements.status.querySelector('option[value="wo_j1"]').textContent = "W/O de " + match.player1;
      elements.status.querySelector('option[value="wo_j2"]').textContent = "W/O de " + match.player2;
    }

    function openMatch(matchId) {
      var match = findMatch(matchId);
      if (!match) return;
      state.currentMatch = match;
      elements.form.reset();
      elements.error.hidden = true;

      setText(elements.dialogMeta, [
        match.category ? "Categoría " + match.category : "",
        match.week ? "Semana " + match.week : "",
        match.court ? "Cancha " + match.court : ""
      ].filter(Boolean).join(" · "));
      setText(elements.dialogTitle, match.player1 + " vs " + match.player2);
      elements.matchId.value = match.matchId;
      elements.status.value = match.status === "programado" ? "jugado" : match.status;
      elements.date.value = dateForInput((match.record && match.record.date) || match.date || state.dashboard.today);
      elements.notes.value = match.notes || "";
      updatePlayerLabels(match);

      var record = match.record || {};
      setScoreValue(elements.set1Player1, record.set1Player1);
      setScoreValue(elements.set1Player2, record.set1Player2);
      setScoreValue(elements.set2Player1, record.set2Player1);
      setScoreValue(elements.set2Player2, record.set2Player2);
      setScoreValue(elements.stbPlayer1, record.stbPlayer1);
      setScoreValue(elements.stbPlayer2, record.stbPlayer2);
      updateFormMode();
      elements.dialog.showModal();
    }

    function updateFormMode() {
      var status = elements.status.value;
      var isPlayed = status === "jugado";
      var isWo = status.indexOf("wo_") === 0;
      elements.scoreSection.hidden = !isPlayed;
      elements.woExplanation.hidden = !isWo;

      [elements.set1Player1, elements.set1Player2, elements.set2Player1, elements.set2Player2].forEach(function (input) {
        input.required = isPlayed;
      });

      if (!isWo || !state.currentMatch) return;
      var message;
      if (status === "wo_j1") {
        message = state.currentMatch.player1 + " queda ausente. " + state.currentMatch.player2 + " gana y recibe 3 puntos.";
      } else if (status === "wo_j2") {
        message = state.currentMatch.player2 + " queda ausente. " + state.currentMatch.player1 + " gana y recibe 3 puntos.";
      } else {
        message = "Ambos jugadores quedan con W/O. No se asignan puntos ni ganador.";
      }
      setText(elements.woExplanation, message);
    }

    function currentPayload() {
      return {
        matchId: elements.matchId.value,
        status: elements.status.value,
        date: dateForSheet(elements.date.value),
        notes: elements.notes.value.trim(),
        set1Player1: elements.set1Player1.value,
        set1Player2: elements.set1Player2.value,
        set2Player1: elements.set2Player1.value,
        set2Player2: elements.set2Player2.value,
        stbPlayer1: elements.stbPlayer1.value,
        stbPlayer2: elements.stbPlayer2.value
      };
    }

    function showLoading(show, label) {
      elements.loading.hidden = !show;
      elements.save.disabled = show;
      if (label) elements.loading.querySelector("strong").textContent = label;
    }

    function showToast(message) {
      window.clearTimeout(state.toastTimer);
      setText(elements.toast, message);
      elements.toast.classList.add("visible");
      state.toastTimer = window.setTimeout(function () {
        elements.toast.classList.remove("visible");
      }, 3200);
    }

    function errorMessage(error) {
      if (!error) return "Ocurrió un error inesperado.";
      return String(error.message || error).replace(/^Exception:\s*/i, "");
    }

    function saveMatch(event) {
      event.preventDefault();
      elements.error.hidden = true;
      if (!elements.form.reportValidity()) return;

      showLoading(true, "Guardando resultado…");
      google.script.run
        .withSuccessHandler(function (dashboard) {
          state.dashboard = dashboard;
          state.currentMatch = null;
          elements.dialog.close();
          showLoading(false);
          renderDashboard();
          showToast("Partido guardado y publicado en Google Sheets.");
        })
        .withFailureHandler(function (error) {
          showLoading(false);
          setText(elements.error, errorMessage(error));
          elements.error.hidden = false;
        })
        .saveAdminMatch(currentPayload());
    }

    function refreshDashboard() {
      showLoading(true, "Actualizando partidos…");
      google.script.run
        .withSuccessHandler(function (dashboard) {
          state.dashboard = dashboard;
          showLoading(false);
          renderDashboard();
          showToast("Datos actualizados.");
        })
        .withFailureHandler(function (error) {
          showLoading(false);
          showToast(errorMessage(error));
        })
        .getAdminDashboard();
    }

    elements.search.addEventListener("input", function () {
      state.query = elements.search.value;
      renderMatches();
    });
    elements.category.addEventListener("change", function () {
      state.category = elements.category.value;
      renderMatches();
    });
    elements.tabs.forEach(function (tab) {
      tab.addEventListener("click", function () {
        state.view = tab.dataset.view;
        elements.tabs.forEach(function (candidate) {
          if (candidate === tab) candidate.setAttribute("aria-current", "page");
          else candidate.removeAttribute("aria-current");
        });
        renderMatches();
      });
    });
    elements.status.addEventListener("change", updateFormMode);
    elements.form.addEventListener("submit", saveMatch);
    elements.refresh.addEventListener("click", refreshDashboard);
    elements.close.addEventListener("click", function () { elements.dialog.close(); });
    elements.cancel.addEventListener("click", function () { elements.dialog.close(); });
    elements.dialog.addEventListener("close", function () { state.currentMatch = null; });

    renderDashboard();
  })();
</script>
