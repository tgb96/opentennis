<style>
  :root {
    --green-950: #073528;
    --green-800: #0d5a42;
    --green-650: #177458;
    --clay-700: #b74722;
    --clay-500: #d86835;
    --cream-100: #fff9ef;
    --cream-300: #f1dfc3;
    --ink: #1c2924;
    --muted: #69756f;
    --line: #ddcfba;
    --white: #ffffff;
    --danger: #a92f25;
    --shadow: 0 14px 38px rgba(47, 32, 18, .12);
  }
  [hidden] { display: none !important; }

  * { box-sizing: border-box; }
  html { background: #ead3ae; }
  body {
    margin: 0;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 90% 0%, rgba(211, 98, 46, .18), transparent 34%),
      linear-gradient(180deg, #fff8eb, #ead3ae);
  }

  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid rgba(216, 104, 53, .42);
    outline-offset: 2px;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 11px;
    min-height: 68px;
    padding: calc(10px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-left)) 10px max(14px, env(safe-area-inset-right));
    color: white;
    background: rgba(7, 53, 40, .97);
    box-shadow: 0 7px 22px rgba(7, 53, 40, .22);
  }
  .brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.8);
    object-fit: cover;
    background: white;
  }
  .brand-copy { display: grid; line-height: 1.05; }
  .brand-copy strong { font-size: 18px; text-transform: uppercase; letter-spacing: .04em; }
  .brand-copy span { margin-top: 4px; font-size: 11px; color: rgba(255,255,255,.72); }
  .icon-button {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    margin-left: auto;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;
    color: inherit;
    background: rgba(255,255,255,.1);
    font-size: 24px;
    font-weight: 800;
  }

  .shell { width: min(820px, 100%); margin: 0 auto; padding: 22px 14px 50px; }
  .intro { display: flex; justify-content: space-between; align-items: end; gap: 16px; }
  .intro h1 { margin: 2px 0 5px; font-size: clamp(30px, 7vw, 48px); line-height: .95; text-transform: uppercase; color: var(--green-950); }
  .eyebrow { margin: 0; color: var(--clay-700); font-size: 12px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
  .muted { margin: 0; color: var(--muted); font-size: 13px; }

  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 18px 0; }
  .summary-card {
    display: grid;
    gap: 5px;
    min-width: 0;
    padding: 13px;
    border: 1px solid rgba(255,255,255,.66);
    border-radius: 18px;
    background: rgba(255,255,255,.77);
    box-shadow: 0 8px 22px rgba(47,32,18,.08);
  }
  .summary-card span { color: var(--muted); font-size: 11px; font-weight: 800; }
  .summary-card strong { font-size: 28px; line-height: 1; }
  .summary-card.pending strong { color: var(--clay-700); }
  .summary-card.upcoming strong { color: #98710c; }
  .summary-card.played strong { color: var(--green-650); }
  .week-panel {
    display: grid;
    gap: 14px;
    margin: 0 0 14px;
    padding: 17px;
    border-radius: 22px;
    color: white;
    background: linear-gradient(135deg, #073528, #0d5a42);
    box-shadow: 0 13px 30px rgba(7,53,40,.2);
  }
  .week-heading, .publication-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .week-heading h2 { margin: 3px 0 4px; font-size: 24px; }
  .week-panel .eyebrow { color: #efaa77; }
  .week-panel .muted { color: rgba(255,255,255,.73); }
  .week-counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .week-counts span { display: grid; gap: 2px; padding: 10px; border-radius: 14px; text-align: center; font-size: 10px; font-weight: 800; background: rgba(255,255,255,.1); }
  .week-counts b { font-size: 21px; }
  .compact-button { min-height: 38px !important; padding: 7px 11px; border-radius: 11px !important; font-size: 11px; white-space: nowrap; }
  .integrity-status { display:grid; gap:3px; margin:-5px 0 16px; padding:12px 14px; border:1px solid; border-radius:14px; font-size:12px; }
  .integrity-status strong { font-size:13px; }
  .integrity-status span { line-height:1.35; }
  .integrity-status.is-ok { color:#185b41; border-color:#b9d6c7; background:#e8f4ed; }
  .integrity-status.has-issues { color:#842b24; border-color:#e1aaa4; background:#f9e2df; }
  .alerts-center { margin: 0 0 14px; border: 1px solid rgba(7,53,40,.12); border-radius: 17px; background: rgba(255,255,255,.7); overflow: hidden; }
  .alerts-center summary { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; list-style: none; }
  .alerts-center summary::-webkit-details-marker { display: none; }
  .alerts-center summary span { display: grid; gap: 2px; }
  .alerts-center summary small { color: var(--muted); font-size: 11px; }
  .alerts-center summary > b { display: grid; place-items: center; min-width: 28px; height: 28px; border-radius: 999px; color: white; background: var(--clay-700); font-size: 12px; }
  .alerts-list { display: grid; gap: 7px; padding: 0 10px 10px; }
  .alert-item { display: grid; grid-template-columns: 9px minmax(0,1fr) auto; gap: 9px; align-items: start; padding: 11px; border-radius: 13px; background: #fffaf2; }
  .alert-dot { width: 9px; height: 9px; margin-top: 4px; border-radius: 50%; background: #bd7620; }
  .alert-item.error .alert-dot { background: var(--danger); }
  .alert-item.success .alert-dot { background: var(--green-650); }
  .alert-copy { display: grid; gap: 3px; }
  .alert-copy strong { font-size: 12px; }
  .alert-copy small { color: var(--muted); line-height: 1.35; }
  .alert-action { min-height: 30px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 9px; color: var(--green-950); background: white; font-size: 10px; font-weight: 900; }
  .publication-status { display: grid; gap: 13px; margin: 0 0 15px; padding: 15px; border: 1px solid #c7b28e; border-radius: 18px; background: #fffaf0; box-shadow: 0 8px 22px rgba(47,32,18,.07); }
  .publication-heading strong { display: block; margin-top: 3px; }
  .publication-steps { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin: 0; padding: 0; list-style: none; }
  .publication-steps li { display: grid; grid-template-columns: 25px minmax(0,1fr); gap: 7px; align-items: start; padding: 9px; border-radius: 12px; background: #f2eadc; }
  .publication-steps li > span { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 50%; color: white; background: #9b9489; font-size: 11px; font-weight: 900; }
  .publication-steps p { display: grid; gap: 2px; margin: 0; }
  .publication-steps b { font-size: 11px; }
  .publication-steps small { color: var(--muted); font-size: 9px; line-height: 1.25; }
  .publication-steps li.is-ok { background: #e1f0e7; }
  .publication-steps li.is-ok > span { background: var(--green-650); }
  .publication-steps li.is-working > span { background: #c9852a; animation: pulse 1s infinite alternate; }
  .publication-steps li.has-warning { background: #faecd1; }
  .publication-steps li.has-warning > span { background: #b97414; }
  .publication-steps li.has-error { background: #f8dfdc; }
  .publication-steps li.has-error > span { background: var(--danger); }
  .undo-button { justify-self: start; min-height: 38px; padding: 8px 12px; border: 1px solid #d09372; border-radius: 11px; color: #8b381d; background: #fff; font-weight: 900; }

  .controls { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 9px; }
  .controls input, .controls select, .field input, .field select, .field textarea {
    width: 100%;
    min-height: 48px;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 13px;
    color: var(--ink);
    background: rgba(255,255,255,.91);
  }
  textarea { resize: vertical; }

  .tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    margin: 14px 0;
    padding: 5px;
    border: 1px solid rgba(7,53,40,.12);
    border-radius: 17px;
    background: rgba(255,255,255,.56);
  }
  .tabs button {
    min-width: 0;
    min-height: 42px;
    padding: 8px 4px;
    border: 0;
    border-radius: 12px;
    color: var(--green-950);
    background: transparent;
    font-size: 12px;
    font-weight: 900;
  }
  .tabs button[aria-current="page"] { color: white; background: var(--green-800); }

  .match-list { display: grid; gap: 10px; }
  .match-card {
    display: grid;
    gap: 11px;
    width: 100%;
    padding: 15px;
    border: 1px solid rgba(7,53,40,.1);
    border-radius: 20px;
    color: var(--ink);
    text-align: left;
    background: rgba(255,255,255,.9);
    box-shadow: 0 10px 28px rgba(47,32,18,.09);
  }
  .match-card:hover { border-color: rgba(13,90,66,.35); transform: translateY(-1px); }
  .match-card-main { display: grid; gap: 11px; width: 100%; padding: 0; border: 0; color: inherit; text-align: left; background: transparent; }
  .match-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .match-meta { color: var(--muted); font-size: 12px; font-weight: 800; }
  .status-pill { display: inline-flex; padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 900; background: #eef1ed; }
  .status-pill.jugado, .status-pill.wo_j1, .status-pill.wo_j2, .status-pill.wo_ambos { color: #0b5d42; background: #dceee7; }
  .status-pill.por_coordinar, .status-pill.pendiente, .status-pill.suspendido { color: #873819; background: #fbe4d8; }
  .schedule-badge { display: inline-flex; margin-top: 8px; padding: 4px 8px; border-radius: 999px; color: #315b45; background: #e7f0e9; font-size: 11px; font-weight: 850; }
  .schedule-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .match-players { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; font-size: 17px; font-weight: 900; }
  .match-players span:last-child { text-align: right; }
  .versus { color: var(--clay-500); font-size: 11px; }
  .match-result { padding-top: 9px; border-top: 1px solid #eee4d4; color: var(--green-800); font-size: 13px; font-weight: 850; }
  .quick-actions { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; padding-top: 10px; border-top: 1px solid #eee4d4; }
  .quick-actions button { min-height: 35px; padding: 6px 4px; border: 1px solid #cfbea5; border-radius: 10px; color: var(--green-950); background: #fffaf1; font-size: 10px; font-weight: 900; }
  .quick-actions button:first-child { color: white; border-color: var(--green-800); background: var(--green-800); }
  .match-group-title { display: flex; justify-content: space-between; align-items: center; margin: 8px 3px 0; color: var(--green-950); font-size: 13px; }
  .match-group-title span { display: grid; place-items: center; min-width: 25px; height: 25px; padding: 0 7px; border-radius: 999px; color: white; background: var(--green-800); font-size: 10px; }
  .empty-state { padding: 38px 18px; border: 1px dashed var(--line); border-radius: 20px; text-align: center; color: var(--muted); background: rgba(255,255,255,.55); }

  .match-dialog {
    width: min(620px, calc(100% - 20px));
    max-height: calc(100dvh - 20px);
    padding: 0;
    border: 0;
    border-radius: 24px;
    color: var(--ink);
    background: var(--cream-100);
    box-shadow: 0 30px 90px rgba(0,0,0,.35);
  }
  .match-dialog::backdrop { background: rgba(5,28,22,.68); backdrop-filter: blur(4px); }
  .match-dialog form { display: grid; max-height: calc(100dvh - 20px); }
  .dialog-header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: start;
    gap: 14px;
    padding: 18px;
    color: white;
    background: var(--green-950);
  }
  .dialog-header h2 { margin: 4px 0 0; font-size: 22px; line-height: 1.05; }
  .dialog-header .eyebrow { color: #efaa77; }
  .dialog-body { overflow: auto; display: grid; gap: 15px; padding: 18px; }
  .field { display: grid; gap: 7px; font-weight: 850; }
  .field small { color: var(--muted); font-weight: 600; }
  .score-section { padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: white; }
  .score-head { display: grid; gap: 3px; margin-bottom: 12px; }
  .score-head span { color: var(--muted); font-size: 12px; }
  .score-grid { display: grid; grid-template-columns: minmax(75px, .8fr) 1fr 1fr; align-items: center; gap: 8px; margin-top: 8px; }
  .score-grid label { font-size: 13px; font-weight: 900; }
  .score-grid input { width: 100%; min-width: 0; min-height: 48px; border: 1px solid var(--line); border-radius: 13px; text-align: center; font-size: 19px; font-weight: 900; }
  .score-labels { color: var(--green-950); font-size: 11px; font-weight: 900; text-align: center; }
  .notice { padding: 13px; border-radius: 14px; color: #71341d; background: #fae2d4; font-size: 13px; font-weight: 750; }
  .save-preview { display: grid; gap: 7px; padding: 14px; border: 1px solid #c9b795; border-radius: 16px; background: #fff4df; }
  .save-preview > strong { color: var(--green-950); font-size: 16px; }
  .preview-points { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .preview-point { display: grid; gap: 2px; padding: 9px; border-radius: 11px; background: white; font-size: 11px; }
  .preview-point b { color: var(--green-800); font-size: 17px; }
  .preview-ranking { margin: 0; color: #6d4b2e; font-size: 11px; line-height: 1.4; }
  .form-error { padding: 12px; border-radius: 12px; color: #7f211b; background: #f9dcd9; font-weight: 800; }
  .dialog-actions { display: grid; grid-template-columns: .8fr 1.2fr; gap: 9px; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #f7ead6; }
  .primary-button, .secondary-button { min-height: 49px; border-radius: 14px; font-weight: 900; }
  .primary-button { border: 0; color: white; background: linear-gradient(180deg, var(--clay-500), var(--clay-700)); }
  .secondary-button { border: 1px solid var(--line); color: var(--green-950); background: white; }

  .loading-overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 12px; color: white; background: rgba(5,28,22,.78); }
  .loading-overlay[hidden] { display: none; }
  .spinner { width: 38px; height: 38px; border: 4px solid rgba(255,255,255,.28); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; }
  .toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 110; transform: translate(-50%, 18px); width: min(480px, calc(100% - 28px)); padding: 12px 16px; border-radius: 999px; color: white; text-align: center; font-size: 13px; font-weight: 850; background: #17251f; opacity: 0; pointer-events: none; transition: .18s ease; }
  .toast.visible { opacity: 1; transform: translate(-50%, 0); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { to { opacity: .55; } }
  @media (max-width: 560px) {
    .shell { padding-top: 18px; }
    .controls { grid-template-columns: 1fr; }
    .tabs { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .tabs button { font-size: 9px; padding-inline: 2px; }
    .summary-card { padding: 11px; }
    .summary-card span { font-size: 10px; }
    .match-players { font-size: 15px; }
    .week-heading { align-items: end; }
    .week-counts span { padding: 8px 4px; }
    .quick-actions { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .publication-steps { grid-template-columns: 1fr; }
    .publication-steps li { grid-template-columns: 25px minmax(0,1fr); }
    .publication-steps small { font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
