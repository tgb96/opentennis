<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073528">
  <meta name="robots" content="noindex,nofollow">
  <title>Open Tennis Admin</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="../assets/icons/admin-icon-512.png">
  <link rel="apple-touch-icon" href="../assets/icons/admin-icon-512.png">
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 22px; color: #0b2f25; background: radial-gradient(circle at top, #fffaf0 0, #f3dfbf 55%, #ddbc89 100%); }
    main { width: min(430px, 100%); padding: 28px; border: 1px solid rgba(255,255,255,.8); border-radius: 28px; text-align: center; background: rgba(255,251,243,.9); box-shadow: 0 22px 60px rgba(46,30,15,.18); }
    img { width: 112px; height: 112px; border-radius: 27px; object-fit: cover; filter: drop-shadow(0 13px 18px rgba(8,49,37,.18)); }
    h1 { margin: 18px 0 6px; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: -.02em; }
    p { margin: 0 auto; max-width: 32ch; color: #5f685f; line-height: 1.5; }
    .private { display: inline-flex; margin: 15px 0 20px; padding: 7px 11px; border-radius: 999px; color: #fff; background: #0f5b45; font-size: 12px; font-weight: 850; }
    .actions { display: grid; gap: 10px; }
    button, a { min-height: 48px; display: grid; place-items: center; padding: 12px 18px; border: 0; border-radius: 15px; font: inherit; font-weight: 850; text-decoration: none; cursor: pointer; }
    .primary { color: #fff; background: linear-gradient(135deg, #d56632, #a53c18); box-shadow: 0 10px 23px rgba(165,60,24,.24); }
    .secondary { color: #0b2f25; border: 1px solid #bbcbc4; background: #fff; }
    .help { margin-top: 16px; font-size: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img src="../assets/icons/admin-icon-512.png" alt="Ícono de Open Tennis Admin">
    <h1>Open Tennis Admin</h1>
    <p>Registro privado de resultados, pendientes y reprogramaciones del torneo.</p>
    <span class="private">Acceso solo para tu cuenta autorizada</span>

    <div class="actions">
      <button id="installButton" class="primary" type="button" hidden>Instalar aplicación</button>
      <a id="openButton" class="secondary" href="https://script.google.com/macros/s/AKfycbwl36ghljLigbxZ8u4wc8V4AA03uVCirF5nXUd-6XgJWvwEe5Jxe3TDak7RMq1ecwwo5Q/exec">Abrir administrador</a>
    </div>
    <p id="helpText" class="help">Preparando instalación segura…</p>
  </main>

  <script>
    (function () {
      const ADMIN_URL = "https://script.google.com/macros/s/AKfycbwl36ghljLigbxZ8u4wc8V4AA03uVCirF5nXUd-6XgJWvwEe5Jxe3TDak7RMq1ecwwo5Q/exec";
      const installButton = document.getElementById("installButton");
      const openButton = document.getElementById("openButton");
      const helpText = document.getElementById("helpText");
      const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      let installPrompt = null;

      if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");

      if (standalone) {
        installButton.hidden = true;
        helpText.textContent = "Abriendo tu administrador privado…";
        window.setTimeout(() => window.location.replace(ADMIN_URL), 250);
        return;
      }

      helpText.textContent = "Instálala una vez; después este botón no volverá a aparecer dentro del administrador.";
      window.addEventListener("beforeinstallprompt", event => {
        event.preventDefault();
        installPrompt = event;
        installButton.hidden = false;
      });

      installButton.addEventListener("click", async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        const choice = await installPrompt.userChoice;
        installPrompt = null;
        if (choice.outcome === "accepted") {
          installButton.hidden = true;
          helpText.textContent = "Aplicación instalada. Ya puedes abrirla desde Windows o tu teléfono.";
          openButton.textContent = "Abrir administrador ahora";
        }
      });

      window.addEventListener("appinstalled", () => {
        installButton.hidden = true;
        helpText.textContent = "Aplicación instalada correctamente.";
      });
    })();
  </script>
</body>
</html>
