<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Torneo | Open Tennis Huechuraba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css?v=30">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0b2f25">
  <script src="assets/js/data-cache.js?v=2"></script>
  <script src="assets/js/club-events.js?v=11"></script>
  <script src="assets/js/events-page.js?v=2"></script>
  <script src="assets/js/season-platform.js?v=1"></script>
  <script defer src="assets/js/app.js?v=32"></script>
</head>
<body class="event-detail-page v5-page">
  <div class="layout app-shell">
    <aside class="sidebar app-topbar">
      <a class="brand" href="index.html" aria-label="Open Tennis Huechuraba inicio"><img class="brand-logo" src="assets/icons/icon-512.png" alt="" aria-hidden="true"><span class="brand-text"><span class="brand-main">Open Tennis</span><span class="brand-sub">Huechuraba · 2026</span></span></a>
    </aside>
    <main class="main app-main event-detail-main">
      <a class="event-detail-back" href="eventos.html">← Volver a Torneos</a>
      <div id="eventDetail" aria-live="polite"><p class="event-detail-loading">Cargando información…</p></div>
    </main>
  </div>

  <nav id="appBottomNav" class="app-bottom-nav" aria-label="Navegación principal">
    <a href="index.html" data-page="index.html"><span class="nav-icon" aria-hidden="true">🏠</span><span class="nav-label">Inicio</span></a>
    <a href="partidos.html" data-page="partidos.html"><span class="nav-icon" aria-hidden="true">🎾</span><span class="nav-label">Partidos</span></a>
    <a href="tablas.html" data-page="tablas.html"><span class="nav-icon" aria-hidden="true">📊</span><span class="nav-label">Tablas</span></a>
    <a href="eventos.html" data-page="eventos.html" aria-label="Torneos e interclubes"><span class="nav-icon" aria-hidden="true">🏆</span><span class="nav-label">Torneos</span></a>
    <a href="marcador.html" data-page="marcador.html"><span class="nav-icon" aria-hidden="true">🔢</span><span class="nav-label">Marcador</span></a>
  </nav>

  <script>
    (function loadEventDetail() {
      const params = new URLSearchParams(window.location.search);
      const eventId = params.get("id") || "";
      const selectedPlayer = localStorage.getItem("openTennisPlayerV1") || "";
      const source = window.OPEN_TENNIS_CACHE
        ? window.OPEN_TENNIS_CACHE.getText("data/actividades-2026.json?v=8")
        : fetch("data/actividades-2026.json?v=8").then(response => response.text());

      Promise.all([source, window.OPEN_TENNIS_SEASON_PLATFORM.fetchPublic()]).then(([value, publicData]) => {
        const merged = window.OPEN_TENNIS_SEASON_PLATFORM.mergeActivities(value, publicData);
        const view = window.OPEN_TENNIS_EVENTS_PAGE.renderDetail(merged, eventId, selectedPlayer, new Date());
        document.title = view.title ? `${view.title} | Open Tennis Huechuraba` : "Torneo | Open Tennis Huechuraba";
        document.getElementById("eventDetail").innerHTML = view.html;
      }).catch(() => {
        document.getElementById("eventDetail").innerHTML = '<div class="events-empty"><strong>No se pudo cargar esta actividad.</strong><p>Vuelve a Torneos e inténtalo nuevamente.</p></div>';
      });
    })();
  </script>
</body>
</html>
